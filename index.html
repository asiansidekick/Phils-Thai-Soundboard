<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phil's Thai Soundboard">
<title>Phil's Thai Soundboard</title>
<style>
:root{--bg:#07070f;--card:#16162a;--ink:#ffffff;--mute:#d4d4ee;--line:#3b3b66;--acc:#ffd23f;--accink:#101010;--danger:#ff6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px}
h1{font-size:18px;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;min-height:38px}
.ib.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#now{min-height:20px;margin-top:6px;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:10px 12px 96px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:96px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s}
.tile:active,.tile.hit{transform:scale(.96);background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tile:active small,.tile.hit small{color:inherit}
.th{font-size:21px;font-weight:600;line-height:1.35}
.tile small{color:var(--mute);font-size:13px}
.tile .ro{font-style:italic}
.x{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--bg);font-size:15px;display:grid;place-items:center}
.edit .tile{border-style:dashed}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.empty,.note{color:var(--mute);text-align:center;padding:30px 10px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;text-align:left;font-size:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=checkbox]{width:auto}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.warn{color:var(--danger)}
.ib.big{font-size:30px;line-height:1;min-height:50px;min-width:50px;padding:4px 12px}
h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;align-items:center;gap:7px;flex:none;margin:0;color:var(--ink);font-size:14px;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer}
.trk{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked+.trk{background:var(--acc)}
.sw input:checked+.trk::after{transform:translateX(18px)}

/* night / high-contrast theme */
body{font-size:17px}
header{background:linear-gradient(180deg,#14143a,#07070f);border-bottom:2px solid #ffd23f}
h1{white-space:normal;overflow:visible;text-overflow:clip;font-size:21px;line-height:1.15;font-weight:800}
h1 .tt{background:linear-gradient(90deg,#ffd23f,#ff6b9d,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ib{border:2px solid #5a5a99;background:#1f1f3d;color:#fff;font-weight:600}
.ib.on{background:#ffd23f;color:#101010;border-color:#ffd23f}
.chip{border:2px solid var(--c,#8a8ab5);background:transparent;color:#fff;font-weight:700;padding:7px 14px}
.chip.on{background:var(--c,#fff);color:#101010;border-color:var(--c,#fff)}
.sec{color:var(--c,#fff);font-size:14px;font-weight:800;letter-spacing:.1em;border-bottom:2px solid var(--c,#fff);padding-bottom:4px}
.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.tile{border:2px solid var(--c,#8a8ab5);background:var(--card);min-height:106px;gap:4px}
.tile:active,.tile.hit{background:var(--c,#ffd23f);color:#101010;border-color:var(--c,#ffd23f)}
.th{font-size:24px;font-weight:800;color:#fff}
.tile small{font-size:16px;color:var(--mute)}
.tile .ro{font-size:15px;font-weight:600;color:var(--c,#ffd23f)}
.tile .en{font-size:19px;font-weight:700;color:#fff;line-height:1.2;font-style:normal}
.tile:active .th,.tile.hit .th,.tile:active small,.tile.hit small{color:#101010!important}
#now{color:#ffd23f;font-size:15px;font-weight:600}
.fab{background:#ffd23f;color:#101010}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:50;max-width:90vw;padding:12px 18px;border-radius:14px;font-weight:700;font-size:17px;background:#7bd88f;color:#101010;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#ff6b6b}
#trs{font-size:15px}
dialog{max-height:88vh;overflow:auto}
.tile .auto{font-size:12px;font-weight:600;color:#ffd23f}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.rth{font-size:30px;font-weight:800;line-height:1.35;color:#fff;margin-top:14px}
.rro{color:#ffd23f;font-weight:600;font-size:17px}
.ren{font-size:20px;font-weight:700;margin-top:4px}
.tool{margin:12px;padding:14px;border:2px solid #ffd23f;border-radius:18px;background:#101028}
#trIn{font-size:22px;margin:10px 0;min-height:92px}
.bigbtn{min-height:54px;font-size:19px;font-weight:800}
.sec2{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffd23f}
.boardhead{padding:6px 12px 0}
.boardhead #q{margin-top:8px;width:100%}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><span class="fl">🇹🇭</span> <span class="tt">Phil's Thai Soundboard</span></h1>
    <button class="ib" id="slow" aria-label="Slow speech" title="Slow speech">🐢</button>
    <button class="ib big" id="setBtn" aria-label="Settings">⚙︎</button>
    <button class="ib" id="editBtn">Edit</button>
  </div>
  <div class="row" style="margin-top:6px;gap:12px"><label class="sw" aria-label="Polite ending"><input type="checkbox" id="polT"><span class="trk"></span><span>Polite ครับ/ค่ะ</span></label><div id="now" style="flex:1;min-width:0"></div></div>
</header>
<section class="tool" id="tool">
  <div class="row" style="gap:8px"><button class="ib on" id="dirEn" style="flex:1">English → Thai</button><button class="ib" id="dirTh" style="flex:1">Thai → English</button></div>
  <textarea id="trIn" rows="3" maxlength="400" placeholder="Type English…"></textarea>
  <div class="row" style="gap:8px"><button class="ib pri bigbtn" id="trGo" style="flex:1">Translate</button><button class="ib bigbtn" id="trMic" style="display:none" aria-label="Speak your phrase">🎤</button></div>
  <div id="trOut"></div>
  <div id="hist"></div>
</section>
<div class="boardhead"><div class="sec2">Phrase board</div><input id="q" type="search" placeholder="Search phrases"></div>
<div class="chips" id="chips"></div>
<main id="main"></main>
<button class="fab" id="fab" aria-label="Add phrase">+</button>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="addD">
  <div class="row" style="justify-content:space-between;gap:10px"><h3 style="margin:0">Add a phrase</h3><div class="row"><button class="ib" id="addCancel">Close</button><button class="ib pri" id="addGo">Save</button></div></div>
  <label for="en">English (type this, then tap Save)</label>
  <input id="en" placeholder="Coffee, please">
  <div id="trs" style="font-size:13px;color:var(--mute);min-height:18px;margin-top:6px"></div>
  <label for="th">Thai script (leave empty to translate automatically)</label>
  <input id="th" lang="th" placeholder="เช่น ขอกาแฟหน่อย">
  <label for="ro">Romanization (optional)</label>
  <input id="ro" placeholder="khor gaa-fae noi">
  <label for="cat">Category</label>
  <select id="cat"></select>
  <input id="catNew" placeholder="New category name" style="display:none;margin-top:8px">
  <datalist id="cats"></datalist>
</dialog>

<dialog id="edD">
  <div class="row" style="justify-content:space-between;gap:10px"><h3 style="margin:0">Edit phrase</h3><div class="row"><button class="ib" id="edCancel">Close</button><button class="ib pri" id="edSave">Save</button></div></div>
  <label for="eth">Thai script (spoken aloud)</label>
  <input id="eth" lang="th">
  <label for="ero">Romanization</label>
  <input id="ero">
  <label for="een">English meaning</label>
  <input id="een">
  <label for="ecat">Move to category</label>
  <select id="ecat"></select>
  <input id="ecatNew" placeholder="New category name" style="display:none;margin-top:8px">
  <div id="eds" style="min-height:18px;margin-top:8px;font-size:15px;font-weight:700"></div>
</dialog>

<dialog id="setD">
  <h3 style="margin:0">Settings</h3>
  <label for="pol">Speaker (sets which polite ending to use; turn it on or off with the Polite switch at the top)</label>
  <select id="pol">
    <option value="m">ครับ khrap: male speaker</option>
    <option value="f">ค่ะ / คะ kha: female speaker</option>
  </select>
  <label for="voice">Thai voice</label>
  <select id="voice"></select>
  <label class="ck"><input type="checkbox" id="sRo"> Show romanization</label>
  <label class="ck"><input type="checkbox" id="sEn"> Show English</label>
  <label>Backup (phrases only; import merges with what you have)</label>
  <div class="row"><button class="ib" id="exp" style="flex:1">Export backup</button><button class="ib" id="imp" style="flex:1">Import backup</button></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <div id="bs" style="font-size:13px;color:var(--mute);min-height:18px;margin-top:6px"></div>
  <div class="act" style="justify-content:space-between">
    <button class="ib warn" id="reset">Reset phrases</button>
    <button class="ib pri" id="setClose">Done</button>
  </div>
</dialog>

<script>
const D={

"Film production":["แอคชั่น|aek-chan|Action!|-","คัท|khat|Cut!|-","ผ่าน|phaan|Good, approved","อีกเทค|eek thek|One more take","เงียบ|ngiap|Quiet, please|-","พร้อม|phrom|Ready|-","ทุกคนเข้าตำแหน่ง|thuk khon khao tam-naeng|Everyone to your positions|-","ฉากต่อไป|chaak tor pai|Next scene|-","พักก่อน|phak gon|Take a break","เลิกกอง|loek gong|That's a wrap|-","กองถ่าย|gong thaai|Film set|-","ถ่ายทำ|thaai tham|Filming / shooting|-","ตารางถ่ายทำ|taa-raang thaai tham|Shooting schedule|-","บท|bot|Script|-","ผู้กำกับ|phuu gam-gap|Director|-","ผู้กำกับภาพ|phuu gam-gap phaap|Cinematographer (DP)|-","ผู้ช่วยผู้กำกับ|phuu chuay phuu gam-gap|Assistant director|-","ผู้อำนวยการสร้าง|phuu am-nuay-gaan sang|Producer|-","นักแสดง|nak sa-daeng|Actor|-","ทีมงาน|thiim ngaan|Crew|-","กล้อง|klong|Camera|-","ย้ายกล้อง|yaai klong|Move the camera|-","ไฟ|fai|Light|-","ไฟสว่างไป|fai sa-waang pai|The light is too bright","ไมค์|mai|Microphone|-","เสียงดังไป|siang dang pai|Too loud","ขอดูมอนิเตอร์หน่อย|khor duu mon-ni-toe noi|Can I see the monitor?","เครื่องแต่งกาย|khrueang taeng gaai|Costume|-","แต่งหน้า|taeng naa|Makeup|-","อุปกรณ์ประกอบฉาก|up-pa-gon pra-gop chaak|Props|-","ตัดต่อ|tat tor|Editing|-"],

};
const KEY="thaisb.v2",Q=/(ไหม|ไหน|อะไร|เท่าไหร่|เหรอ|หรือเปล่า)$/;
let S={items:[],pol:"m",polite:true,slow:false,voice:"",ro:true,en:true},cat="All",edit=false,qs="";
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);

function defaults(){const a=[];for(const c in D)D[c].forEach(r=>{const[t,ro,en,f]=r.split("|");a.push({id:uid(),th:t,ro,en,cat:c,np:f==="-"?1:0})});return a}
const PATCHES={onset2:{cat:"On set",items:["เซ็ตต่อไป|set tor pai|Next set-up|-","ไปต่อ|pai tor|Moving on|-"]}};
function applyPatches(){
  if(!Array.isArray(S.applied))S.applied=[];
  let ch=false;
  for(const k in PATCHES){
    if(S.applied.includes(k))continue;
    const P=PATCHES[k],at=S.items.findIndex(i=>i.cat===P.cat);

    if(!list.length)return;
    if(cat==="All")h+=`<div class="sec" style="--c:${colr(c)}">${esc(c)}</div>`;
    h+=`<div class="grid">`+list.map(i=>{const f=full(i);return `<button class="tile" style="--c:${colr(i.cat)}" data-id="${i.id}"><span class="th" lang="th">${esc(f.th)}</span>${S.ro&&f.ro?`<small class="ro">${esc(f.ro)}</small>`:""}${S.en&&f.en?`<small class="en">${esc(f.en)}</small>`:""}${i.auto?`<small class="auto">⚠ auto-translated</small>`:""}${edit?`<span class="x" data-del="${i.id}">×</span>`:""}</button>`}).join("")+`</div>`;
  });
  $("main").className=edit?"edit":"";
  $("main").innerHTML=h+(/class="grid"/.test(h)?"":`<div class="empty">Nothing here. Tap + to add a phrase.</div>`);
  $("editBtn").classList.toggle("on",edit);
  $("editBtn").textContent=edit?"Done":"Edit";
}

$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;render();window.scrollTo(0,0)}};
$("q").oninput=e=>{qs=e.target.value.trim();render()};
$("main").onclick=e=>{
  const d=e.target.closest("[data-del]");
  if(d){e.stopPropagation();S.items=S.items.filter(i=>i.id!==d.dataset.del);const ok=save();render();toast(ok?"Deleted":"⚠ Deleted, but not saved",!ok);return}
  const t=e.target.closest(".tile");
  if(!t)return;
  if(edit){openEdit(t.dataset.id);return}
  const it=S.items.find(i=>i.id===t.dataset.id);
  if(it){t.classList.add("hit");setTimeout(()=>t.classList.remove("hit"),180);speak(it)}
};
$("slow").onclick=()=>{S.slow=!S.slow;save();render()};
$("editBtn").onclick=()=>{edit=!edit;render()};
$("fab").onclick=()=>{["th","ro","en"].forEach(k=>$(k).value="");$("trs").textContent="";$("catNew").value="";fillCat();$("addD").showModal();$("en").focus()};
$("addCancel").onclick=()=>$("addD").close();
let SM=null;
async function translate(){
  const en=$("en").value.trim();
  if(!en||!SM)return false;
  $("trs").textContent="Translating…";
  try{
    const r=await SM.json(`Translate this English phrase into natural, polite Thai for a traveler. Do not add a politeness particle (ครับ/ค่ะ) at the end; the app adds it. Reply with ONLY JSON: {"th":"Thai script","ro":"simple romanization with hyphenated syllables, no tone marks","cat":"one of: Basics, Eating, Getting around, Shopping, Numbers, Social, Emergency, or a short new category name"}\nPhrase: ${en}`);
    if(r&&r.th){$("th").value=r.th;$("ro").value=r.ro||"";if(r.cat&&cats().includes(r.cat))$("cat").value=r.cat;$("trs").textContent="Check it looks right, then tap Save.";return true}
  }catch(e){}
  $("trs").textContent="Couldn't translate. You can type the Thai yourself.";
  return false;
}
let DIR="en",RES=null;
function setDir(d){
  DIR=d;$("dirEn").classList.toggle("on",d==="en");$("dirTh").classList.toggle("on",d==="th");
  $("trIn").placeholder=d==="en"?"Type English…":"Type or paste Thai…";
  $("trIn").lang=d==="th"?"th":"en";$("trIn").value="";$("trOut").innerHTML="";
}
async function mm(q,pair){
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),9000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+pair,{signal:ac.signal});
    if(!r.ok)throw 0;
    const d=await r.json();
    const t=d&&d.responseData&&d.responseData.translatedText;
    if(!t||/MYMEMORY|QUERY LENGTH/i.test(String(t)))throw 0;
    return String(t).trim();
  }finally{clearTimeout(to)}
}
function showRes(th,ro,en,note,auto,nohist){
  RES={th,ro,en,auto:auto?1:0};
  const cs=cats();
  const opts=cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
  $("trOut").innerHTML=`<div class="rth" lang="th">${esc(th)}</div>${ro?`<div class="rro">${esc(ro)}</div>`:""}<div class="ren">${esc(en)}</div>`+
   `<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><button class="ib" data-a="sp">🔊 Speak</button><button class="ib" data-a="cp">Copy Thai</button></div>`+
   `<div class="row" style="margin-top:10px;gap:8px"><select id="rcat" style="flex:1">${opts}<option value="__new">＋ New category…</option></select><button class="ib pri" data-a="save">💾 Save</button></div><input id="rcatNew" placeholder="New category name" style="display:none;margin-top:8px">`+
   (note?`<div style="margin-top:10px;color:#ffd23f;font-size:13px;font-weight:600">${esc(note)}</div>`:"");
  $("rcat").value=(cat!=="All"&&cat!=="__r"&&cs.includes(cat))?cat:cs[0];
  $("rcat").onchange=()=>{const n=$("rcat").value==="__new";$("rcatNew").style.display=n?"":"none";if(n)$("rcatNew").focus()};
  if(!nohist)addHist({th,ro,en});
}
function addHist(h){
  S.hist=(S.hist||[]).filter(x=>!(x.th===h.th&&x.en===h.en));
  S.hist.unshift({th:h.th,ro:h.ro||"",en:h.en});
  S.hist=S.hist.slice(0,12);save();renderHist();
}
function renderHist(){
  const h=S.hist||[];
  $("hist").innerHTML=h.length?`<div class="sec2" style="margin-top:16px">Recent translations</div><div class="chips" style="padding:8px 0 0">${h.map((x,i)=>`<button class="chip" data-h="${i}" style="--c:#8a8ab5">${esc(x.en.length>28?x.en.slice(0,26)+"…":x.en)}</button>`).join("")}<button class="chip" data-h="clear" style="--c:#ff6b6b">Clear</button></div>`:"";
}
$("hist").onclick=e=>{
  const b=e.target.closest("[data-h]");if(!b)return;
  if(b.dataset.h==="clear"){S.hist=[];save();renderHist();return}
  const x=S.hist[+b.dataset.h];if(x)showRes(x.th,x.ro,x.en,"",false,true);
};
async function doTr(){
  const q=$("trIn").value.trim();
  if(!q)return;
  $("trOut").innerHTML=`<div style="margin-top:12px">Translating…</div>`;
  try{
    if(SM){
      const r=await SM.json(`Translate the following text between English and Thai. The source text is ${DIR==="en"?"English":"Thai"}. Use natural, polite wording for a film crew or traveler, without a politeness particle at the end. Reply with ONLY JSON: {"th":"the Thai text","ro":"romanization of the Thai with hyphenated syllables and no tone marks","en":"the English text"}\nText: ${q}`);
      if(!r||!r.th||!r.en)throw 0;
      showRes(r.th,r.ro||"",r.en,"",false);
    }else if(DIR==="en"){
      let t=await mm(q,"en|th");
      t=t.replace(/\s*(ครับ|ค่ะ|คะ)\s*$/,"").trim();
      if(!/[\u0e00-\u0e7f]/.test(t))throw 0;
      showRes(t,"",q,"Automatic translation: please check it before relying on it.",true);
    }else{
      const e=await mm(q,"th|en");
      showRes(q,"",e,"Automatic translation: please check it before relying on it.",true);
    }
  }catch(e){$("trOut").innerHTML=`<div style="margin-top:12px;color:#ff6b6b;font-weight:700">Couldn't translate (are you online?). Try again.</div>`}
}
$("dirEn").onclick=()=>setDir("en");
$("dirTh").onclick=()=>setDir("th");
$("trGo").onclick=doTr;
$("trOut").onclick=e=>{
  const b=e.target.closest("[data-a]");if(!b||!RES)return;
  if(b.dataset.a==="sp")speak({th:RES.th,ro:RES.ro,en:RES.en,cat:"x",np:1});
  else if(b.dataset.a==="cp"){navigator.clipboard.writeText(RES.th).then(()=>toast("✓ Copied")).catch(()=>toast("Couldn't copy",true))}
  else if(b.dataset.a==="save"){
    let c=$("rcat").value;
    if(c==="__new"){c=$("rcatNew").value.trim();if(!c){$("rcatNew").focus();toast("Type a category name",true);return}}
    S.items.push({id:uid(),th:RES.th,ro:RES.ro||"",en:RES.en,cat:c,t:Date.now(),auto:RES.auto?1:0});
    const ok=save();render();
    toast(ok?"✓ Saved to "+c:"⚠ Not saved permanently",!ok);
    b.textContent="✓ Saved";b.disabled=true;
  }
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  $("trMic").style.display="";
  $("trMic").onclick=()=>{
    try{
      const r=new SR();r.lang=DIR==="th"?"th-TH":"en-US";r.interimResults=false;
      r.onresult=ev=>{$("trIn").value=ev.results[0][0].transcript;doTr()};
      r.onerror=()=>{$("trOut").innerHTML=`<div style="margin-top:12px;color:#ff6b6b;font-weight:700">Couldn't use the microphone. Check Safari's microphone permission.</div>`};
      r.start();$("trOut").innerHTML=`<div style="margin-top:12px">Listening…</div>`;
    }catch(e){}
  };
}
let EID=null;
function fillECat(sel){
  const cs=cats();
  $("ecat").innerHTML=cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")+`<option value="__new">＋ New category…</option>`;
  $("ecat").value=sel;
  if($("ecat").value!==sel)$("ecat").value=cs[0]||"__new";
  $("ecatNew").style.display=$("ecat").value==="__new"?"":"none";
}
$("ecat").onchange=()=>{const n=$("ecat").value==="__new";$("ecatNew").style.display=n?"":"none";if(n)$("ecatNew").focus()};
function openEdit(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  EID=id;$("eth").value=it.th;$("ero").value=it.ro||"";$("een").value=it.en||"";
  $("ecatNew").value="";$("eds").textContent="";fillECat(it.cat);$("edD").showModal();
}
$("edCancel").onclick=()=>$("edD").close();
$("edSave").onclick=()=>{
  const k=S.items.findIndex(i=>i.id===EID);if(k<0)return;
  const bad=m=>{$("eds").style.color="#ff6b6b";$("eds").textContent=m};
  const th=$("eth").value.trim();
  if(!th)return bad("The Thai script can't be empty.");
  let c=$("ecat").value;
  if(c==="__new"){c=$("ecatNew").value.trim();if(!c){$("ecatNew").focus();return bad("Type a name for the new category.")}}
  const it=S.items[k],moved=it.cat!==c;
  it.th=th;it.ro=$("ero").value.trim();it.en=$("een").value.trim();it.auto=0;
  if(moved){
    S.items.splice(k,1);it.cat=c;
    let at=-1;S.items.forEach((x,n)=>{if(x.cat===c)at=n});
    if(at<0)S.items.push(it);else S.items.splice(at+1,0,it);
  }
  const ok=save();
  $("edD").close();render();
  toast(ok?(moved?"✓ Moved to "+c:"✓ Saved"):"⚠ Not saved permanently",!ok);
};
$("edD").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();$("edSave").click()}};
function fillCat(sel){
  const cs=cats();
  const pick=sel||((cat!=="All"&&cat!=="__r"&&cs.includes(cat))?cat:(cs[0]||"__new"));
  $("cat").innerHTML=cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")+`<option value="__new">＋ New category…</option>`;
  $("cat").value=pick;
  $("catNew").style.display=$("cat").value==="__new"?"":"none";
}
$("cat").onchange=()=>{const n=$("cat").value==="__new";$("catNew").style.display=n?"":"none";if(n)$("catNew").focus()};
async function webTranslate(en){
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),9000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(en)+"&langpair=en|th",{signal:ac.signal});
    if(!r.ok)throw 0;
    const d=await r.json();
    let t=d&&d.responseData&&d.responseData.translatedText;
    if(!t)throw 0;
    t=String(t).replace(/\s*(ครับ|ค่ะ|คะ)\s*$/,"").trim();
    if(!/[\u0e00-\u0e7f]/.test(t)||/MYMEMORY|QUERY LENGTH/i.test(t))throw 0;
    return t;
  }finally{clearTimeout(to)}
}
async function add(){
  if(!$("th").value.trim()&&$("en").value.trim()&&SM){await translate();return}
  let th=$("th").value.trim(),auto=false;
  if(!th&&$("en").value.trim()){
    say("Translating…",true);
    try{th=await webTranslate($("en").value.trim());auto=true}
    catch(e){say("Couldn't translate (are you online?). Try again, or type the Thai yourself.",false);return}
  }
  if(!th){say("Type an English word first.",false);$("en").focus();return}
  let c=$("cat").value;
  if(c==="__new"){c=$("catNew").value.trim();if(!c){say("Type a name for the new category.",false);$("catNew").focus();return}}
  S.items.push({id:uid(),th,ro:$("ro").value.trim(),en:$("en").value.trim(),cat:c,t:Date.now(),auto:auto?1:0});
  const ok=save();cat=c;qs="";$("q").value="";render();
  $("now").textContent="Added: "+th;
  ["th","ro","en","catNew"].forEach(k=>$(k).value="");
  fillCat(c);
  if(ok){say("✓ Saved "+th+" to "+c+(auto?". Auto-translated, so please check it.":". Add another, or tap Close."),true);toast("✓ Saved: "+th)}
  else{say("⚠ Added, but this browser can't keep it after you close the page (private browsing?).",false);toast("⚠ Not saved permanently",true)}
  $("en").focus();
}
$("addGo").onclick=add;
$("addD").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="SELECT"){e.preventDefault();add()}};
$("setBtn").onclick=()=>{$("pol").value=S.pol;$("sRo").checked=S.ro;$("sEn").checked=S.en;$("setD").showModal()};
$("setClose").onclick=()=>$("setD").close();
$("pol").onchange=e=>{S.pol=e.target.value;save();render()};
$("sRo").onchange=e=>{S.ro=e.target.checked;save();render()};
$("sEn").onchange=e=>{S.en=e.target.checked;save();render()};
$("voice").onchange=e=>{S.voice=e.target.value;save();speak({th:"สวัสดี",cat:"Basics"})};
$("reset").onclick=()=>{if(confirm("Replace all phrases with the defaults? Your added phrases will be lost.")){S.items=defaults();S.seen=Object.keys(D);S.applied=Object.keys(PATCHES);applyPatches2();applyP3();applyP4();applyP5();applyP6();applyP7();applyP8();save();cat="All";render();$("setD").close()}};

load();render();loadVoices();renderHist();
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=loadVoices;
$("polT").checked=S.polite;
$("polT").onchange=e=>{S.polite=e.target.checked;save();render()};
$("exp").onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify({app:"thai-soundboard",v:2,items:S.items},null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="thai-soundboard-backup.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    $("bs").textContent="Backup downloaded.";
  }catch(e){$("bs").textContent="Couldn't export a backup."}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items))throw 0;
    const have=new Set(S.items.map(i=>i.cat+"|"+i.th));
    let n=0;
    d.items.forEach(i=>{
      if(!i||typeof i.th!=="string"||!i.th)return;
      const c=i.cat||"Custom";
      if(have.has(c+"|"+i.th))return;
      S.items.push({id:uid(),th:i.th,ro:i.ro||"",en:i.en||"",cat:c,t:i.t,np:i.np});n++;
    });
    save();render();
    $("bs").textContent=n+" new phrase"+(n===1?"":"s")+" imported.";
  }catch(x){$("bs").textContent="That file isn't a valid backup."}
};
</script>
</body>
</html>
