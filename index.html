<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phil's Thai Soundboard">
<title>Phil's Thai Soundboard</title>
<style>
:root{--bg:#07070f;--card:#16162a;--ink:#ffffff;--mute:#d4d4ee;--line:#3b3b66;--acc:#ffd23f;--accink:#101010;--danger:#ff6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px}
h1{font-size:18px;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;min-height:38px}
.ib.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#now{min-height:20px;margin-top:6px;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:10px 12px 96px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;min-height:96px;padding:12px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s}
.tile:active,.tile.hit{transform:scale(.96);background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tile:active small,.tile.hit small{color:inherit}
.th{font-size:21px;font-weight:600;line-height:1.35}
.tile small{color:var(--mute);font-size:13px}
.tile .ro{font-style:italic}
.x{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid var(--bg);font-size:15px;display:grid;place-items:center}
.edit .tile{border-style:dashed}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.empty,.note{color:var(--mute);text-align:center;padding:30px 10px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;text-align:left;font-size:14px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=checkbox]{width:auto}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.warn{color:var(--danger)}
.ib.big{font-size:30px;line-height:1;min-height:50px;min-width:50px;padding:4px 12px}
h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;align-items:center;gap:7px;flex:none;margin:0;color:var(--ink);font-size:14px;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;padding:0;border:0;cursor:pointer}
.trk{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked+.trk{background:var(--acc)}
.sw input:checked+.trk::after{transform:translateX(18px)}

/* night / high-contrast theme */
body{font-size:17px}
header{background:linear-gradient(180deg,#14143a,#07070f);border-bottom:2px solid #ffd23f}
h1{white-space:normal;overflow:visible;text-overflow:clip;font-size:21px;line-height:1.15;font-weight:800}
h1 .tt{background:linear-gradient(90deg,#ffd23f,#ff6b9d,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ib{border:2px solid #5a5a99;background:#1f1f3d;color:#fff;font-weight:600}
.ib.on{background:#ffd23f;color:#101010;border-color:#ffd23f}
.chip{border:2px solid var(--c,#8a8ab5);background:transparent;color:#fff;font-weight:700;padding:7px 14px}
.chip.on{background:var(--c,#fff);color:#101010;border-color:var(--c,#fff)}
.sec{color:var(--c,#fff);font-size:14px;font-weight:800;letter-spacing:.1em;border-bottom:2px solid var(--c,#fff);padding-bottom:4px}
.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
.tile{border:2px solid var(--c,#8a8ab5);background:var(--card);min-height:106px;gap:4px}
.tile:active,.tile.hit{background:var(--c,#ffd23f);color:#101010;border-color:var(--c,#ffd23f)}
.th{font-size:24px;font-weight:800;color:#fff}
.tile small{font-size:16px;color:var(--mute)}
.tile .ro{font-size:15px;font-weight:600;color:var(--c,#ffd23f)}
.tile .en{font-size:19px;font-weight:700;color:#fff;line-height:1.2;font-style:normal}
.tile:active .th,.tile.hit .th,.tile:active small,.tile.hit small{color:#101010!important}
#now{color:#ffd23f;font-size:15px;font-weight:600}
.fab{background:#ffd23f;color:#101010}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:50;max-width:90vw;padding:12px 18px;border-radius:14px;font-weight:700;font-size:17px;background:#7bd88f;color:#101010;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#ff6b6b}
#trs{font-size:15px}
dialog{max-height:88vh;overflow:auto}
.tile .auto{font-size:12px;font-weight:600;color:#ffd23f}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.rth{font-size:30px;font-weight:800;line-height:1.35;color:#fff;margin-top:14px}
.rro{color:#ffd23f;font-weight:600;font-size:17px}
.ren{font-size:20px;font-weight:700;margin-top:4px}
.tool{margin:12px;padding:14px;border:2px solid #ffd23f;border-radius:18px;background:#101028}
#trIn{font-size:22px;margin:10px 0;min-height:92px}
.bigbtn{min-height:54px;font-size:19px;font-weight:800}
.sec2{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#ffd23f}
.boardhead{padding:6px 12px 0}
.boardhead #q{margin-top:8px;width:100%}

/* ===== Monet-inspired palette, large legible type ===== */
:root{--bg:#eef2f8;--panel:#fcfbf7;--ink:#1b2238;--mute:#3b4666;--line:#8fa0c8;--edge:#1b2238;--card:#fcfbf7;--k:#1b2238;--acc:#f3d27a;--blue:#8db4e6;--lilac:#b9a7e0;color-scheme:light;
--bf:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html[data-th="night"]{--bg:#111a2e;--panel:#1a2540;--ink:#f6f2ea;--mute:#dde1ef;--line:#6d7fae;--edge:#f6f2ea;--card:#1a2540;--k:#e9e5f4;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:22px;line-height:1.3}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 45% at 10% 0%,rgba(141,180,230,.30),transparent 70%),radial-gradient(60% 45% at 95% 15%,rgba(185,167,224,.24),transparent 70%),radial-gradient(70% 45% at 40% 100%,rgba(159,207,174,.20),transparent 70%),radial-gradient(40% 30% at 88% 88%,rgba(240,168,192,.18),transparent 70%)}
h1,.sec,.sec2,.chip,.ib,#toast,.bigbtn,label,.note,.sw,#now,input,select,textarea,.tile small,.tile .en,.ren,.rro,.hint,.spd,.tabbar button{font-family:var(--bf);letter-spacing:0;text-transform:none}
.th,.rth{font-family:system-ui,-apple-system,"Noto Sans Thai","Noto Sans",sans-serif}
header{position:static;background:var(--panel);color:var(--ink);border-bottom:2px solid var(--line);box-shadow:none;padding:10px 12px}
h1{font-size:23px;line-height:1.15;font-weight:700}
h1::after{content:none}
.fl{display:none}
h1 .tt{display:inline;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);-webkit-text-fill-color:var(--ink);text-shadow:none;transform:none;box-shadow:none;padding:0}
h1 .tt::before{content:none}
#setBtn,.fab{display:none}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:8px}
#now{min-height:0;color:var(--mute);font-size:18px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now:empty{display:none}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:20px;font-weight:700;margin:0}
.trk{width:58px;height:34px;border:2px solid var(--k);border-radius:17px;background:transparent}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;inset:auto;border-radius:50%;background:var(--k);box-shadow:none;transition:transform .15s}
.sw input:checked+.trk{background:var(--blue);border-color:var(--blue)}
.sw input:checked+.trk::after{content:"";transform:translateX(24px);background:#0f1730;font-size:0}
.spd{display:flex;align-items:center;gap:8px;flex:1 1 100%;min-width:0;margin:0;color:var(--ink);font-size:20px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:42px;padding:0;border:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-13px;border-radius:50%;background:var(--lilac);border:2px solid var(--k)}
input[type=range]::-moz-range-track{height:6px;background:var(--line);border-radius:3px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--lilac);border:2px solid var(--k)}
.ib{border:2px solid var(--k);border-radius:999px;background:var(--panel);color:var(--ink);box-shadow:none;font-size:22px;font-weight:700;padding:8px 20px;min-height:54px}
header .ib{border-color:var(--k);color:var(--ink);background:var(--panel)}
.ib:active{background:var(--ink);color:var(--bg);transform:none;box-shadow:none}
.ib.on,header .ib.on{background:var(--ink);color:var(--bg);border-color:var(--k);box-shadow:none}
.ib.pri{background:var(--blue);color:#0f1730;border-color:var(--blue);box-shadow:none}
.bigbtn{font-size:26px;min-height:62px}
.speakbtn{flex:1 1 55%;min-height:84px;font-size:38px;background:var(--lilac);color:#161030;border:2px solid var(--lilac);border-radius:999px;box-shadow:none}
.speakbtn:active{background:var(--ink);color:var(--bg)}
.savebtn{display:block;width:100%;background:var(--acc);color:#1d1604;border:2px solid var(--acc);border-radius:999px;font-size:27px;font-weight:700;min-height:68px;box-shadow:0 0 0 4px rgba(243,210,122,.38)}
.savebtn.sm{display:inline-block;width:auto;min-height:54px;font-size:22px;padding:8px 20px;box-shadow:0 0 0 3px rgba(243,210,122,.38)}
.savebtn:active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.savebtn:disabled{opacity:.85}
.micbtn{width:88px;min-height:88px;padding:0;display:grid;place-items:center;background:var(--panel);color:var(--ink);border:2px solid var(--k);border-radius:50%;box-shadow:none}
.micbtn svg{display:block;width:50px;height:50px}
#trMic.rec{background:#f0a8c0;color:#2a0f1a;border-color:#f0a8c0;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{background:var(--panel);color:var(--ink)}}
.tool{position:relative;margin:12px 10px;padding:16px;border:2px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 8px 28px rgba(20,30,70,.16);scroll-margin-top:20px}
.tool::before,.tool::after{content:none}
.langrow{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:21px;font-weight:700;color:var(--ink)}
.langrow select{flex:1}
.hint{font-size:17px;font-weight:400;color:var(--mute);margin:8px 0 0}
input,select,textarea{border:2px solid var(--k);border-radius:16px;background:var(--panel);color:var(--ink);font-size:22px;font-weight:400;padding:12px 14px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--blue);padding:0}
::placeholder{color:var(--mute);opacity:.75}
#trIn{font-size:32px;font-weight:400;min-height:112px;margin:10px 0;border:2px solid var(--k);border-radius:18px;box-shadow:none;background:var(--panel);color:var(--ink)}
.bub{position:relative;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:12px 0 14px;box-shadow:none}
.bub::before,.bub::after{display:none}
.bub .rth{color:var(--ink);font-size:46px;font-weight:400;line-height:1.3;margin-top:0}
.bub .rro{color:var(--mute);font-size:27px;font-weight:400;font-style:normal}
.bub .ren{color:var(--ink);font-size:30px;font-weight:400}
.sec2{display:inline-block;background:none;color:var(--ink);border:0;box-shadow:none;padding:0;font-size:24px;font-weight:700;text-shadow:none}
.boardhead{padding:6px 12px 0;scroll-margin-top:12px}
.chips{padding:8px 12px 0;gap:10px}
.chip{position:relative;border:2px solid var(--k);border-radius:999px;background:var(--panel);color:var(--ink);font-size:21px;font-weight:700;box-shadow:none;padding:8px 18px 8px 14px;display:inline-flex;align-items:center;gap:8px}
.chip::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c,#999);border:2px solid var(--k);position:static;transform:none}
.chip.on{outline:0;transform:none;background:var(--ink);color:var(--bg)}
.sec{display:flex;align-items:center;gap:10px;background:none;color:var(--ink);border:0;border-bottom:2px solid var(--line);box-shadow:none;padding:0 0 4px;margin:16px 0 10px;font-size:26px;font-weight:700;text-shadow:none}
.sec::before{content:"";display:inline-block;position:static;width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--k)}
main{padding:6px 12px 130px}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;border:2px solid var(--line);border-top:8px solid var(--c,#999);border-radius:20px;background:var(--panel);color:var(--ink);box-shadow:0 5px 16px rgba(20,30,70,.14);min-height:104px;padding:10px 8px;gap:3px}
.tile::before{content:none}
.tile.pend .th{opacity:.45}
.tile:active,.tile.hit{background:var(--ink);transform:none;box-shadow:none}
.tile:active *,.tile.hit *{color:var(--bg)!important}
.th{color:var(--ink);font-size:29px;font-weight:700;line-height:1.3}
.tile .ro{font-size:20px;font-style:normal;font-weight:400;color:var(--mute);opacity:1}
.tile .en{font-size:23px;font-weight:700;color:var(--ink);line-height:1.15}
.tile small{color:var(--ink)}
.tile .auto{font-size:15px;color:var(--ink);text-decoration:underline}
.x{width:32px;height:32px;top:-10px;right:-8px;border:2px solid var(--bg);border-radius:50%;background:#ef8f8a;color:#2a0d0c;font-family:system-ui,sans-serif;font-weight:900;font-size:19px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);border-top:2px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;background:none;border:0;color:var(--ink);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tabbar svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button:active{opacity:.6}

dialog::backdrop{background:rgba(8,12,30,.65)}
label{color:var(--ink);font-size:20px;font-weight:700;margin:12px 0 4px}
label.ck{font-weight:400;font-size:22px}
label.sw,label.spd{margin:0}
label.langrow{margin:0 0 12px}

#toast.show{transform:translateX(-50%)}
#toast.bad{background:#ef8f8a;border-color:#ef8f8a;color:#2a0d0c}

  REC=r;
  r.lang=DIR==="th"?LG().tts:"en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let got=false,err=null;const t0=Date.now();
  r.onstart=()=>{RECON=true;$("trMic").classList.add("rec");micMsg("Listening… speak now",false)};
  r.onresult=ev=>{

  };

  if(moved){
    it.cat=c;S.items.splice(k,1);
    let at=-1;S.items.forEach((x,n)=>{if(x.cat===c)at=n});
    if(at<0)S.items.push(it);else S.items.splice(at+1,0,it);
  }
  if(it.orig){const o=it.orig;it.edited=(it.th!==o.th||it.en!==o.en||it.cat!==o.cat||(it.ro||"")!==(o.ro||""))?1:0}
  const ok=save();
  $("edD").close();render();
  toast(ok?(moved?"✓ Moved to "+c:"✓ Saved"):"⚠ Not saved permanently",!ok);
};
$("edSave2").onclick=()=>$("edSave").click();
$("edD").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();$("edSave").click()}};
function fillCat(sel){
  const cs=cats();
  const pick=sel||((cat!=="All"&&cat!=="__r"&&cs.includes(cat))?cat:(cs[0]||"__new"));
  $("cat").innerHTML=cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")+`<option value="__new">＋ New category…</option>`;
  $("cat").value=pick;
  $("catNew").style.display=$("cat").value==="__new"?"":"none";
}
$("cat").onchange=()=>{const n=$("cat").value==="__new";$("catNew").style.display=n?"":"none";if(n)$("catNew").focus()};
async function webTranslate(en){
  let t=await webTr(en,"en",LG().mm);
  if(S.lang==="th"){t=t.replace(/\s*(ครับ|ค่ะ|คะ)\s*$/,"").trim();if(!/[\u0e00-\u0e7f]/.test(t))throw new Error("the answer wasn't Thai")}
  return t;
}
async function add(){
  if(!$("th").value.trim()&&$("en").value.trim()&&SM){await translate();return}
  let th=$("th").value.trim(),auto=false;
  if(!th&&$("en").value.trim()){
    say("Translating…",true);
    try{th=await webTranslate($("en").value.trim());auto=true}
    catch(e){say("Couldn't translate: "+why(e)+"."+hintHost()+" Try again, or type the text yourself.",false);return}
  }
  if(!th){say("Type an English word first.",false);$("en").focus();return}
  let c=$("cat").value;
  if(c==="__new"){c=$("catNew").value.trim();if(!c){say("Type a name for the new category.",false);$("catNew").focus();return}}
  S.items.push(newItem(th,$("ro").value.trim(),$("en").value.trim(),c,auto));
  const ok=save();cat=c;qs="";$("q").value="";render();
  $("now").textContent="Added: "+th;
  ["th","ro","en","catNew"].forEach(k=>$(k).value="");
  fillCat(c);
  if(ok){say("✓ Saved "+th+" to "+c+(auto?". Auto-translated, so please check it.":". Add another, or tap Close."),true);toast("✓ Saved: "+th)}
  else{say("⚠ Added, but this browser can't keep it after you close the page (private browsing?).",false);toast("⚠ Not saved permanently",true)}
  $("en").focus();
}
$("addGo").onclick=add;
$("addGo2").onclick=add;
$("addD").onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="SELECT"){e.preventDefault();add()}};
$("setBtn").onclick=()=>{$("mmEmail").value=S.mmEmail||"";$("sLight").checked=!!S.light;$("pol").value=S.pol;$("sRo").checked=S.ro;$("sEn").checked=S.en;$("setD").showModal()};
$("setClose").onclick=()=>$("setD").close();
$("pol").onchange=e=>{S.pol=e.target.value;save();render()};
function applyTheme(){document.documentElement.setAttribute("data-th",S.light?"light":"night")}
$("sLight").onchange=e=>{S.light=e.target.checked;save();applyTheme()};
$("sRo").onchange=e=>{S.ro=e.target.checked;save();render()};
$("sEn").onchange=e=>{S.en=e.target.checked;save();render()};
$("voice").onchange=e=>{S.voice=e.target.value;save();speak({th:"สวัสดี",cat:"Basics"})};
$("reset").onclick=()=>{if(confirm("Replace all phrases with the defaults? Your added phrases will be lost.")){S.items=defaults();S.seen=Object.keys(D);S.applied=Object.keys(PATCHES);applyPatches2();applyP3();applyP4();applyP5();applyP6();applyP7();applyP8();applyP9();applyP10();applyP11();applyP12();save();cat="All";render();$("setD").close()}};

load();applyTheme();refreshLang();render();loadVoices();renderHist();
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=loadVoices;
$("polT").checked=S.polite;updatePol();
$("polT").onchange=e=>{S.polite=e.target.checked;save();updatePol();render();reshow()};
$("spd").value=S.rate||0.9;
$("spd").oninput=e=>{S.rate=+e.target.value;save()};
$("exp").onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify({app:"thai-soundboard",v:3,items:S.items,deleted:S.deleted||[]},null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="soundboard-backup.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    $("bs").textContent="Backup downloaded.";
  }catch(e){$("bs").textContent="Couldn't export a backup."}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items))throw 0;
    const have=new Set(S.items.map(i=>i.cat+"|"+(i.th||i.en)));
    let n=0;
    d.items.forEach(i=>{
      if(!i||!(i.th||i.en))return;
      const c=i.cat||"Custom";
      if(have.has(c+"|"+(i.th||i.en)))return;
      S.items.push({id:uid(),th:i.th||"",ro:i.ro||"",en:i.en||"",cat:c,t:i.t,np:i.np,tr:i.tr,edited:i.edited,orig:i.orig,auto:i.auto});n++;
    });
    save();render();
    $("bs").textContent=n+" new phrase"+(n===1?"":"s")+" imported.";
  }catch(x){$("bs").textContent="That file isn't a valid backup."}
};
</script>
